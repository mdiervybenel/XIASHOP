<style>
:root{--k:#080808;--s:#C8C8C8;--g:#F4B400;--w:#fff;--a:#202020;--l:#F3F3F3;--wa:#25D366}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--w);color:var(--k);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3,.logo{font-family:Georgia,'Times New Roman',serif}a{color:inherit;text-decoration:none}img{max-width:100%;display:block}
.top{background:var(--g);color:var(--k);text-align:center;font-size:13px;padding:6px 10px;font-weight:600}

.hr{display:flex;align-items:center;gap:10px;padding:8px 14px;flex-wrap:wrap;max-width:1200px;margin:auto}
.logo{display:flex;align-items:center;gap:10px;font-size:26px;letter-spacing:.18em;color:#D4AF37}.logo img{height:46px;width:auto;transition:transform .5s cubic-bezier(.22,1,.36,1),filter .5s}.logo:hover img{transform:scale(1.06);filter:drop-shadow(0 0 8px rgba(232,195,90,.55))}.logo span{font-weight:700}
.logo span,.gold{background:linear-gradient(90deg,#A87A22,#F8E8A6 25%,#D4AF37 50%,#A87A22 75%,#F8E8A6);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 6s linear infinite}
.sr{flex:1;min-width:150px;display:flex}.sr input{flex:1;padding:10px 12px;border:1px solid var(--s);border-radius:8px 0 0 8px;font-size:15px;min-width:0}
.sr button{background:var(--s);border:0;border-radius:0 8px 8px 0;padding:0 14px;cursor:pointer;font-weight:700}
.ib{background:none;border:1px solid var(--a);color:var(--w);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:14px;font-family:inherit}
.ib b{background:var(--g);color:var(--k);border-radius:10px;padding:0 6px;margin-left:4px;font-size:12px}
nav{background:var(--a);overflow-x:auto;white-space:nowrap}nav a{display:inline-block;padding:10px 14px;color:var(--s);font-size:14px}nav a:hover,nav a.on{color:var(--g)}
main{max-width:1200px;margin:auto;padding:16px 14px 90px;min-height:60vh}
.hero{background:var(--k);color:var(--w);border-radius:14px;display:grid;grid-template-columns:1.2fr 1fr;gap:12px;overflow:hidden;align-items:center}
.hero>div:first-child{padding:26px}.hero>.hsl{align-self:stretch}.hero h1{font-size:clamp(26px,5vw,44px);margin:8px 0;color:var(--s);line-height:1.15}.hero img.lg{height:clamp(110px,22vw,190px);width:auto;max-width:100%;margin:0 0 6px -4px}.hero .hp{height:100%;min-height:200px;object-fit:cover;width:100%}
.btn{display:inline-block;background:var(--k);color:var(--w);border:1px solid var(--k);padding:11px 18px;border-radius:8px;font-weight:700;cursor:pointer;font-size:15px;text-align:center;font-family:inherit}
.btn.g{background:var(--g);color:var(--k);border-color:var(--g)}.btn.o{background:none;color:inherit;border-color:currentColor}.btn.w{background:var(--wa);border-color:var(--wa);color:#04210f}.btn.s{padding:6px 10px;font-size:13px}.btn:disabled{opacity:.45;cursor:not-allowed}
h2{font-size:24px;margin:30px 0 12px;border-left:4px solid var(--g);padding-left:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}
.card{border:1px solid #e3e3e3;border-radius:12px;overflow:hidden;background:var(--w);display:flex;flex-direction:column}
.im{aspect-ratio:1;background:var(--l);position:relative;display:flex;align-items:center;justify-content:center;color:var(--s)}.im img{width:100%;height:100%;object-fit:cover}
.b{position:absolute;left:6px;top:6px;background:var(--g);font-style:normal;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px}.b.u{background:#b00020;color:#fff;left:auto;right:6px}.b.h{background:var(--k);color:var(--g);top:auto;bottom:6px}
.cb{padding:10px;flex:1}.cb small{color:#666}.cb h3{font-size:15px;margin:2px 0 6px}.pr{font-weight:700}.pr s{color:#888;font-weight:400;margin-left:4px}.st{color:#b07d00;font-size:13px;letter-spacing:1px}
.card>.btn{margin:0 10px 10px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.cats a{background:var(--k);color:var(--s);border-radius:12px;padding:18px 10px;text-align:center;font-family:Georgia,serif;border:1px solid var(--a)}.cats a:hover{border-color:var(--g);color:var(--g)}
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.why div{background:var(--l);padding:16px;border-radius:12px}
.wab{background:var(--k);color:var(--w);border-radius:14px;padding:24px;text-align:center;margin-top:30px}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:30px}.panel{border:1px solid #e3e3e3;border-radius:14px;padding:18px;background:var(--w)}.panel.d{background:var(--k);color:var(--w);border-color:var(--k)}.panel h3{margin:0 0 6px}
footer{background:var(--k);color:var(--s);padding:24px 14px;font-size:14px}footer .fi{max-width:1200px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}footer a{display:block;padding:3px 0}
.fw{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--wa);color:#04210f;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;box-shadow:0 4px 14px #0005;z-index:30}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}input,select,textarea{padding:9px 10px;border:1px solid #bbb;border-radius:8px;font:inherit;max-width:100%;background:#fff;color:var(--k)}textarea{width:100%}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:24px}.th{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.th img{width:60px;height:60px;object-fit:cover;border-radius:8px;cursor:pointer;border:1px solid #ddd}
#mi img{object-fit:contain;background:#fff}.big{font-size:26px;font-weight:700}.t{width:100%;border-collapse:collapse;font-size:14px}.t td,.t th{border-bottom:1px solid #e3e3e3;padding:8px 6px;text-align:left;vertical-align:middle}
.fm{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.fm label{display:flex;flex-direction:column;font-size:13px;font-weight:600;gap:3px}.fm .f2{grid-column:1/-1}
label.ck{display:flex;flex-direction:row!important;gap:8px;align-items:flex-start;font-weight:400!important;font-size:13px}label.ck input{margin-top:3px}
.nt{background:var(--l);border-left:4px solid var(--g);padding:10px 12px;border-radius:6px;font-size:14px;margin:10px 0}
.rv{border-bottom:1px solid #eee;padding:10px 0}.rv b{margin-right:6px}
.stars{display:flex;gap:4px;flex-direction:row-reverse;justify-content:flex-end}.stars input{display:none}.stars label{font-size:26px;color:#ccc;cursor:pointer}.stars input:checked~label,.stars label:hover,.stars label:hover~label{color:var(--g)}
.sq{margin:14px 0}.sq p{font-weight:700;margin:0 0 6px}.opt{display:inline-flex;align-items:center;gap:6px;border:1px solid #ccc;border-radius:20px;padding:6px 12px;margin:0 6px 6px 0;cursor:pointer;font-size:14px}.opt input{margin:0}
.modal{position:fixed;inset:0;background:#000a;z-index:60;display:flex;align-items:flex-end;justify-content:center;padding:14px}.modal>div{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:20px}
@media(min-width:700px){.modal{align-items:center}}
.cookie{position:fixed;left:14px;right:84px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--k);color:var(--s);border-radius:12px;padding:12px 14px;font-size:13px;z-index:40;display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:620px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--k);color:var(--g);padding:10px 18px;border-radius:10px;z-index:70;display:none;max-width:90vw}
@media(max-width:700px){.hero,.pg{grid-template-columns:1fr}.hero .hp{min-height:160px;max-height:220px}.logo{font-size:20px}.logo img{height:46px}}

/* =========== Motion design =========== */
:root{--ease:cubic-bezier(.22,1,.36,1)}
@keyframes shim{to{background-position:200% center}}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.08)}}
@keyframes pin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes ring{0%{box-shadow:0 4px 14px #0005,0 0 0 0 rgba(37,211,102,.55)}70%,100%{box-shadow:0 4px 14px #0005,0 0 0 16px rgba(37,211,102,0)}}
@keyframes glow{0%,65%,100%{box-shadow:0 0 0 0 rgba(244,180,0,0)}78%{box-shadow:0 0 0 6px rgba(244,180,0,.25)}}
@keyframes bump{40%{transform:scale(1.4)}}
@keyframes sweep{to{transform:translateX(130%)}}
@keyframes toastin{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes hdin{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
/* Entrée de la page d'accueil */
.mo header .logo,.mo header .sr,.mo header .ib{animation:hdin .8s var(--ease) both}
.mo header .sr{animation-delay:.12s}.mo header .ib{animation-delay:.22s}
.mo .hero>div:first-child>*{animation:rise .9s var(--ease) both}
.mo .hero>div:first-child>:nth-child(2){animation-delay:.15s}.mo .hero>div:first-child>:nth-child(3){animation-delay:.3s}.mo .hero>div:first-child>:nth-child(4),.mo .hero>div:first-child>:nth-child(5){animation-delay:.45s}
.hero .hp{animation:kb 14s ease-in-out infinite alternate;transform-origin:60% 50%}
main.pin{animation:pin .55s var(--ease) both}
/* Apparition au défilement */
.mo .rvl{opacity:0;transform:translateY(26px);transition:opacity .8s var(--ease) var(--d,0ms),transform .9s var(--ease) var(--d,0ms),translate .45s var(--ease),box-shadow .45s,border-color .45s,color .3s}
.mo .rvl.in{opacity:1;transform:none}
.mo .rvl.inst{transition:translate .45s var(--ease),box-shadow .45s,border-color .45s,color .3s}
/* En-tête */
header{transition:box-shadow .4s}header.sc{box-shadow:0 8px 24px -10px #000c}
nav a{position:relative;transition:color .3s}
nav a:after{content:'';position:absolute;left:14px;right:14px;bottom:5px;height:2px;background:var(--g);transform:scaleX(0);transform-origin:left;transition:transform .4s var(--ease)}
nav a:hover:after,nav a.on:after{transform:scaleX(1)}
.ib{transition:border-color .3s,transform .25s var(--ease)}.ib:hover{border-color:var(--g)}.ib:active{transform:scale(.95)}
.ib b.bump{display:inline-block;animation:bump .55s var(--ease)}
/* Boutons : reflet lumineux, élévation, halo */
.btn{position:relative;overflow:hidden;isolation:isolate;transition:transform .25s var(--ease),box-shadow .35s,filter .3s}
.btn:after{content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-130%)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.w{animation:glow 4s var(--ease) infinite}
/* Cartes produits */
.card{transition:translate .45s var(--ease),box-shadow .45s,border-color .45s}
.im{overflow:hidden}.im img{transition:transform 1s var(--ease)}
.cats a{transition:translate .4s var(--ease),border-color .3s,color .3s,box-shadow .4s}
.why div{transition:translate .4s var(--ease),box-shadow .4s}
.th img{transition:transform .3s var(--ease),border-color .3s}.th img:hover{transform:translateY(-2px);border-color:var(--g)}
@media(hover:hover){
 .btn:not(:disabled):hover{transform:translateY(-2px)}
 .btn:not(:disabled):hover:after{animation:sweep .9s var(--ease)}
 .btn.g:not(:disabled):hover{box-shadow:0 8px 22px -8px rgba(244,180,0,.75)}
 .card:hover{translate:0 -6px;box-shadow:0 18px 36px -18px rgba(0,0,0,.35);border-color:var(--g)}
 .card:hover .im img{transform:scale(1.07)}
 .cats a:hover{translate:0 -4px;box-shadow:0 12px 26px -12px rgba(244,180,0,.55)}
 .why div:hover{translate:0 -3px;box-shadow:0 12px 26px -16px rgba(0,0,0,.3)}
}
.fw{animation:ring 2.6s ease-out infinite;transition:transform .3s var(--ease)}.fw:hover{transform:scale(1.08)}
#toast.on{animation:toastin .4s var(--ease)}
.modal>div{animation:rise .5s var(--ease)}

/* Diaporama produits dans le bandeau d'accueil */
.hsl{position:relative;height:100%;min-height:340px;overflow:hidden;touch-action:pan-y;background:#111}
.hsi{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity 1.1s var(--ease),visibility 0s 1.1s}
.hsi.on{opacity:1;visibility:visible;transition:opacity 1.1s var(--ease),visibility 0s;z-index:1}
.hsi img{width:100%;height:100%;object-fit:cover;transform:scale(1.12)}
.hsi.on img{animation:kbz 5.5s linear both}
.hcap{position:absolute;left:0;right:0;bottom:0;padding:70px 18px 18px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.72) 45%,rgba(0,0,0,.92));color:#fff;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.hcap>*{opacity:0;transform:translateY(14px);transition:opacity .7s var(--ease),transform .8s var(--ease)}
.hsi.on .hcap>*{opacity:1;transform:none}.hsi.on .hcap>:nth-child(1){transition-delay:.35s}.hsi.on .hcap>:nth-child(2){transition-delay:.5s}.hsi.on .hcap>:nth-child(3){transition-delay:.65s}
.hcap small{color:var(--g);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:11px}
.hcap b{font-family:Georgia,serif;font-size:clamp(18px,2.2vw,24px);line-height:1.2;margin-bottom:6px}
.hdots{position:absolute;z-index:2;top:14px;right:14px;display:flex;gap:6px}
.hdots button{width:9px;height:9px;border-radius:9px;border:0;padding:0;background:rgba(255,255,255,.5);cursor:pointer;transition:width .4s var(--ease),background .3s}
.hdots button.on{width:26px;background:var(--g)}
@keyframes kbz{from{transform:scale(1.12)}to{transform:scale(1)}}
/* Bande de produits qui défilent en continu */
.vit{overflow:hidden;margin:0 -14px;padding:6px 0 10px;-webkit-mask:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.vtr{display:flex;gap:14px;width:max-content;animation:marq var(--dur,40s) linear infinite}
.vit:hover .vtr{animation-play-state:paused}
.vi{flex:none;width:180px;background:var(--k);color:#fff;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;padding-bottom:12px;transition:translate .4s var(--ease),box-shadow .4s}
.vim{display:block;aspect-ratio:1;overflow:hidden}.vim img{width:100%;height:100%;object-fit:cover;transition:transform .9s var(--ease)}
.vi b{font-size:13px;font-weight:600;line-height:1.3;padding:10px 12px 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:43px}
.vi .btn{margin:0 12px;align-self:flex-start}
@media(hover:hover){.vi:hover{translate:0 -5px;box-shadow:0 14px 28px -12px rgba(244,180,0,.5)}.vi:hover .vim img{transform:scale(1.08)}}
@keyframes marq{to{transform:translateX(calc(-50% - 7px))}}
.btn.ask{animation:glow 4s var(--ease) infinite}
@media(max-width:700px){.hsl{min-height:300px;order:-1}.vi{width:150px}}
@media(prefers-reduced-motion:reduce){.vit{overflow-x:auto}.vtr .vdup{display:none!important}}

/* Bandeau défilant */
.top{padding:0;overflow:hidden}
.tkr{overflow:hidden;white-space:nowrap}.tkr.st{padding:6px 10px}
.tkt{display:inline-flex;gap:38px;padding:6px 0;animation:marq var(--dur,40s) linear infinite}
.tkr:hover .tkt{animation-play-state:paused}
.tkt a,.tkt span{flex:none}.tkt a:hover{text-decoration:underline}
/* Badge Nouveau avec reflet */
.b.nw{background:var(--k);color:var(--g);overflow:hidden}
.b.nw:after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.6) 50%,transparent 70%);transform:translateX(-130%);animation:sweep2 3.2s 1s ease-in-out infinite}
@keyframes sweep2{0%{transform:translateX(-130%)}35%,100%{transform:translateX(130%)}}
/* Spot publicitaire */
.spot{position:relative;margin-top:30px;height:clamp(300px,36vw,400px);border-radius:14px;overflow:hidden;background:var(--k);color:#fff}
.sp{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1.1fr;align-items:center;opacity:0;visibility:hidden;transition:opacity .8s,visibility 0s .8s}
.sp.on{opacity:1;visibility:visible;transition:opacity .8s,visibility 0s;z-index:1}
.sp.rev .spi{order:2}
.spi{position:relative;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 55%,#3a2c08,#080808 70%)}
.spg{position:absolute;width:70%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(244,180,0,.45),transparent 65%);opacity:0}
.spi img{position:relative;max-height:82%;max-width:80%;object-fit:contain;border-radius:12px;box-shadow:0 30px 50px -20px #000;opacity:0}
.spt{padding:24px clamp(18px,4vw,50px);display:flex;flex-direction:column;align-items:flex-start;gap:8px;position:relative}
.spt>*{opacity:0}
.spt small{color:var(--g);font-weight:800;letter-spacing:.2em;text-transform:uppercase;font-size:11.5px}
.spt b{font-family:Georgia,serif;font-size:clamp(28px,4.4vw,52px);line-height:1.05}
.spt em{font-style:normal;color:var(--s);font-size:clamp(14px,1.6vw,18px);margin-bottom:10px}
.sp.on .spg{animation:spg 5.2s ease-out both}
.sp.on .spi img{animation:spIn 1.1s cubic-bezier(.22,1,.36,1) both,spFl 4s 1.1s ease-in-out infinite}
.sp.rev.on .spi img{animation:spIn2 1.1s cubic-bezier(.22,1,.36,1) both,spFl 4s 1.1s ease-in-out infinite}
.sp.on .spt>*{animation:spTx .8s cubic-bezier(.22,1,.36,1) both}
.sp.on .spt>:nth-child(1){animation-delay:.35s}.sp.on .spt>:nth-child(2){animation-delay:.5s;animation-name:spBig}.sp.on .spt>:nth-child(3){animation-delay:.75s}.sp.on .spt>:nth-child(4){animation:spPop .6s 1s cubic-bezier(.34,1.56,.64,1) both}
.sp:after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 40%,rgba(255,220,120,.16) 50%,transparent 60%);transform:translateX(-110%)}
.sp.on:after{animation:sweep 1.8s .9s ease-in-out both}
.spb{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.12);z-index:3}
.spb i{display:block;height:100%;background:var(--g);transform-origin:left;animation:spBar 5.2s linear both}
@keyframes spIn{from{opacity:0;transform:scale(1.35) rotate(-6deg);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes spIn2{from{opacity:0;transform:translateX(80px) scale(.9)}to{opacity:1;transform:none}}
@keyframes spFl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes spg{0%{opacity:0;transform:scale(.5)}30%{opacity:1;transform:scale(1)}100%{opacity:.7;transform:scale(1.15)}}
@keyframes spTx{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes spBig{from{opacity:0;transform:translateX(-30px);letter-spacing:.12em}to{opacity:1;transform:none;letter-spacing:0}}
@keyframes spPop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes spBar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
/* Mini-publicité */
.mad{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:35;width:290px;max-width:calc(100vw - 100px);background:var(--k);color:#fff;border:1px solid var(--g);border-radius:14px;box-shadow:0 14px 34px -10px #000a;animation:madIn .6s cubic-bezier(.34,1.56,.64,1) both}
.mad.out{animation:madOut .5s ease-in both}
.mad a{display:flex;gap:10px;padding:10px;align-items:center}.mad img{width:64px;height:64px;object-fit:cover;border-radius:10px;flex:none}
.mad span{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0}.mad small{color:var(--g);font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
