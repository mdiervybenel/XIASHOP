<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>XIA SHOP – Espace vendeur</title>
<link rel="icon" href="/uploads/seed-logo.jpg">
<style>
:root{--k:#080808;--s:#C8C8C8;--g:#F4B400;--gd:#8a6200;--w:#fff;--a:#202020;--l:#F4F4F2;--ln:#e3e3e3;--mu:#5f5f5f;--wa:#25D366;--hot:#b3261e;--warm:#9a5b00;--cold:#3b5b7a;--cli:#1d6b3a}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--l);color:var(--k)}
h1,h2,h3{font-family:Georgia,'Times New Roman',serif}h2{font-size:22px;margin:24px 0 10px}h3{font-size:17px;margin:0 0 8px}
a{color:inherit}button,input,select,textarea{font:inherit}
header{background:var(--k);color:var(--s);display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
header b{font-family:Georgia,serif;letter-spacing:.15em;font-size:18px;color:var(--s)}header .sp{flex:1}
header a,header button{color:var(--s);background:none;border:1px solid var(--a);border-radius:8px;padding:6px 10px;cursor:pointer;text-decoration:none;font-size:13px}
.tabs{background:var(--a);overflow-x:auto;white-space:nowrap;position:sticky;top:0;z-index:9}.tabs button{background:none;border:0;color:var(--s);padding:11px 14px;cursor:pointer;font-size:14px;border-bottom:3px solid transparent}.tabs button.on{color:var(--g);border-color:var(--g)}
main{max-width:1240px;margin:auto;padding:16px}
.btn{display:inline-block;background:var(--k);color:var(--w);border:1px solid var(--k);padding:9px 14px;border-radius:8px;font-weight:700;cursor:pointer;font-size:14px;text-decoration:none}
.btn.g{background:var(--g);color:var(--k);border-color:var(--g)}.btn.o{background:var(--w);color:var(--k);border-color:#bbb}.btn.w{background:var(--wa);border-color:var(--wa);color:#04210f}.btn.s{padding:5px 9px;font-size:12px}.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--w);border:1px solid var(--ln);border-radius:12px;padding:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}.kpi{background:var(--w);border:1px solid var(--ln);border-radius:12px;padding:12px 14px}.kpi small{color:var(--mu);display:block;font-size:12px}.kpi b{font-size:26px;display:block;line-height:1.2;font-variant-numeric:tabular-nums}.kpi i{font-style:normal;font-size:12px;color:var(--mu)}.up{color:var(--cli)!important}.dn{color:var(--hot)!important}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin-top:12px}
.bars .br{display:grid;grid-template-columns:minmax(90px,38%) 1fr 48px;gap:8px;align-items:center;margin:6px 0;font-size:13px}.bars .br span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bars .tr{background:#efefec;border-radius:4px;height:14px;position:relative}.bars .fl{background:var(--gd);height:100%;border-radius:0 4px 4px 0;min-width:2px}.bars .br b{text-align:right;font-variant-numeric:tabular-nums}
.col{display:flex;align-items:flex-end;gap:2px;height:150px;border-bottom:1px solid #bbb;padding-top:8px}.col div{flex:1;background:var(--gd);border-radius:4px 4px 0 0;min-height:1px;position:relative;cursor:default}.col div:hover{background:var(--k)}.col.z div{background:#d9d9d6}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--mu);margin-top:4px}
#tip{position:fixed;pointer-events:none;background:var(--k);color:var(--w);font-size:12px;padding:6px 9px;border-radius:6px;z-index:50;display:none;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--w)}th,td{border-bottom:1px solid var(--ln);padding:8px 6px;text-align:left;vertical-align:top}th{font-size:12px;color:var(--mu);font-weight:600;white-space:nowrap}.tw{overflow-x:auto;border:1px solid var(--ln);border-radius:12px}
td img{width:44px;height:44px;object-fit:cover;border-radius:6px}
.seg{display:inline-block;border-radius:10px;padding:1px 8px;font-size:12px;font-weight:700;color:#fff}.seg.Chaud{background:var(--hot)}.seg.Tiède{background:var(--warm)}.seg.Froid{background:var(--cold)}.seg.Client{background:var(--cli)}
.sc{display:inline-block;min-width:34px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--cli);margin-right:5px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
input,select,textarea{padding:8px 9px;border:1px solid #bbb;border-radius:8px;max-width:100%;background:#fff}textarea{width:100%}
.fm{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.fm label{display:flex;flex-direction:column;font-size:13px;font-weight:600;gap:3px}.fm .f2{grid-column:1/-1}
.nt{background:#fff8e1;border-left:4px solid var(--g);padding:10px 12px;border-radius:6px;font-size:14px;margin:10px 0}
.mu{color:var(--mu)}.r{text-align:right}
.login{max-width:380px;margin:12vh auto;background:var(--k);color:var(--s);border-radius:16px;padding:28px}.login h1{color:var(--s);margin:0 0 6px;letter-spacing:.12em}.login input{width:100%;margin:12px 0}
.q{border:1px solid var(--ln);border-radius:10px;padding:10px;margin:8px 0;background:#fafafa}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--k);color:var(--g);padding:10px 18px;border-radius:10px;z-index:60;display:none;max-width:90vw}
.drawer{position:fixed;inset:0;background:#0007;z-index:40;display:flex;justify-content:flex-end}.drawer>div{background:#fff;width:min(520px,100%);height:100%;overflow:auto;padding:18px}
</style></head><body>
<div id="root"></div><div id="tip"></div><div id="toast" role="status"></div><div id="dw"></div>
<script>
var $=function(s){return document.querySelector(s)},esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var fmt=function(n){return Number(n||0).toLocaleString('fr-FR').replace(/[  ]/g,' ')},F=function(n){return fmt(n)+' FCFA'};
var dt=function(t){return t?new Date(t).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):''};
var ago=function(t){var s=(Date.now()-t)/1000;return s<60?'à l\'instant':s<3600?'il y a '+Math.round(s/60)+' min':s<86400?'il y a '+Math.round(s/3600)+' h':'il y a '+Math.round(s/86400)+' j'};
function toast(t){var e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display='none'},3200)}
async function api(u,m,b){var r=await fetch(u,{method:m||'GET',headers:b?{'Content-Type':'application/json'}:{},body:b?JSON.stringify(b):undefined});var j=await r.json().catch(function(){return{}});if(r.status===401&&u!=='/api/admin/login'){A.auth=false;draw();throw new Error('Session expirée, reconnectez-vous')}if(!r.ok)throw new Error(j.error||'Erreur');return j}
var A={auth:null,tab:'dash',days:30,d:{},edit:null,imgs:[],f:'',seg:'',lst:''};
var TABS=[['dash','Tableau de bord'],['vis','Visiteurs'],['leads','Prospects'],['orders','Commandes'],['survey','Sondage'],['reviews','Avis'],['prod','Produits'],['cats','Catégories'],['set','Réglages']];
var OST=[['nouvelle','Nouvelle'],['en_attente','En attente'],['confirmee','Confirmée'],['preparation','En préparation'],['expediee','Expédiée'],['livree','Livrée'],['annulee','Annulée']];
var LST=[['nouveau','Nouveau'],['contacte','Contacté'],['interesse','Intéressé'],['client','Client'],['perdu','Perdu']];
var SRC={direct:'Accès direct',whatsapp:'WhatsApp',facebook:'Facebook',instagram:'Instagram',tiktok:'TikTok',google:'Google'};
function waLink(ph,msg){return 'https://wa.me/'+String(ph||'').replace(/\D/g,'')+(msg?'?text='+encodeURIComponent(msg):'')}
/* ---------- Graphiques simples (une série, une couleur) ---------- */
function hbars(rows,lab){var mx=Math.max.apply(null,rows.map(function(r){return r.n}).concat([1]));return rows.length?'<div class="bars">'+rows.map(function(r){return '<div class="br"><span title="'+esc(lab?lab(r.label):r.label)+'">'+esc(lab?lab(r.label):r.label)+'</span><div class="tr"><div class="fl" style="width:'+(r.n/mx*100)+'%"></div></div><b>'+fmt(r.n)+'</b></div>'}).join('')+'</div>':'<p class="mu">Pas encore de données.</p>'}
function cols(vals,labels,unit){var mx=Math.max.apply(null,vals.concat([1])),z=vals.every(function(v){return!v});return '<div class="col'+(z?' z':'')+'">'+vals.map(function(v,i){return '<div data-tip="'+esc(labels[i]+' : '+fmt(v)+' '+unit)+'" style="height:'+(v/mx*100)+'%"></div>'}).join('')+'</div>'}
document.addEventListener('mousemove',function(e){var t=e.target.closest&&e.target.closest('[data-tip]'),p=$('#tip');if(!t){p.style.display='none';return}p.textContent=t.getAttribute('data-tip');p.style.display='block';p.style.left=Math.min(e.clientX+12,innerWidth-p.offsetWidth-8)+'px';p.style.top=(e.clientY-34)+'px'});
/* ---------- Tableau de bord ---------- */
function delta(c,p){if(!p&&!c)return '';if(!p)return '<i class="up">nouveau</i>';var d=Math.round((c-p)/p*100);return '<i class="'+(d>=0?'up':'dn')+'">'+(d>=0?'▲ +':'▼ ')+d+' % vs période précédente</i>'}
function dash(){var s=A.d.stats;if(!s)return '<p>Chargement…</p>';var k=s.kpi,p=s.prev,conv=k.visitors?Math.round(k.orders/k.visitors*1000)/10:0;
 var K=[['Visiteurs uniques',k.visitors,p.visitors],['Nouveaux visiteurs',k.newVisitors,p.newVisitors],['Pages vues',k.pageviews,p.pageviews],['Fiches produit vues',k.productViews,p.productViews],['Ajouts au panier',k.cartAdds,p.cartAdds],['Clics WhatsApp',k.waClicks,p.waClicks],['Commandes',k.orders,p.orders],['Nouveaux prospects',k.leads,p.leads],['Réponses au sondage',k.surveys,p.surveys]];
 var hl=s.hours.map(function(_,h){return h+' h'});
 return '<div class="bar"><b>Période :</b>'+[[1,'Aujourd\'hui'],[7,'7 jours'],[30,'30 jours'],[90,'90 jours']].map(function(x){return '<button class="btn s '+(A.days===x[0]?'':'o')+'" onclick="A.days='+x[0]+';load()">'+x[1]+'</button>'}).join('')+'<span class="sp" style="flex:1"></span><span><span class="dot"></span><b>'+s.live+'</b> visiteur(s) en ce moment</span></div>'
 +'<div class="kpis">'+K.map(function(x){return '<div class="kpi"><small>'+x[0]+'</small><b>'+fmt(x[1])+'</b>'+delta(x[1],x[2])+'</div>'}).join('')+'<div class="kpi"><small>Chiffre d\'affaires confirmé</small><b>'+fmt(k.revenue)+'</b><i>FCFA</i>'+delta(k.revenue,p.revenue)+'</div><div class="kpi"><small>Taux de conversion</small><b>'+conv+' %</b><i>commandes / visiteurs</i></div></div>'
 +'<div class="g2"><div class="card"><h3>Visiteurs par jour</h3>'+cols(s.series.map(function(x){return x.visitors}),s.series.map(function(x){return new Date(x.day).toLocaleDateString('fr-FR',{day:'2-digit',month:'short'})}),'visiteur(s)')+'<div class="axis"><span>'+esc(s.series[0].day.slice(5).split('-').reverse().join('/'))+'</span><span>'+esc(s.series[s.series.length-1].day.slice(5).split('-').reverse().join('/'))+'</span></div></div>'
 +'<div class="card"><h3>Parcours d\'achat</h3><p class="mu" style="margin:0 0 6px;font-size:13px">Combien de visiteurs passent chaque étape.</p>'+hbars(s.funnel)+(s.funnel[0].n?'<p class="mu" style="font-size:13px;margin:6px 0 0">'+Math.round(s.funnel[3].n/s.funnel[0].n*100)+' % des visiteurs vous ont contacté ou ont commandé.</p>':'')+'</div>'
 +'<div class="card"><h3>D\'où viennent vos visiteurs</h3>'+hbars(s.sources,function(l){return SRC[l]||l})+'<p class="mu" style="font-size:12px;margin:8px 0 0">Astuce : partagez vos liens avec <code>?utm_source=facebook</code> (ou tiktok, statut…) pour mesurer chaque canal.</p></div>'
 +'<div class="card"><h3>Appareils</h3>'+hbars(s.devices)+'</div>'
 +'<div class="card"><h3>Heures de visite (heure de Brazzaville)</h3>'+cols(s.hours,hl,'page(s) vue(s)')+'<div class="axis"><span>0 h</span><span>6 h</span><span>12 h</span><span>18 h</span><span>23 h</span></div><p class="mu" style="font-size:12px;margin:8px 0 0">Publiez vos statuts et promotions juste avant les heures les plus actives.</p></div>'
 +'<div class="card"><h3>Ce que les clients recherchent</h3>'+hbars(s.searches)+'</div></div>'
 +'<h2>Produits les plus regardés</h2>'+(s.topProducts.length?'<div class="tw"><table><tr><th>Produit</th><th class="r">Vues</th><th class="r">Paniers</th><th class="r">WhatsApp</th><th class="r">Taux d\'intérêt</th></tr>'+s.topProducts.map(function(x){return '<tr><td>'+esc(x.name)+'</td><td class="r">'+x.views+'</td><td class="r">'+x.carts+'</td><td class="r">'+x.wa+'</td><td class="r">'+(x.views?Math.round((x.carts+x.wa)/x.views*100):0)+' %</td></tr>'}).join('')+'</table></div>':'<p class="mu">Pas encore de données.</p>')}
/* ---------- Visiteurs ---------- */
function vis(){var L=A.d.vis;if(!L)return '<p>Chargement…</p>';var on=L.filter(function(v){return v.online});
 return '<div class="nt">Les visiteurs sont <b>anonymes</b> tant qu\'ils ne vous ont pas laissé leur numéro (commande, sondage ou inscription). Le score mesure leur intérêt : pages vues, produits consultés, ajouts au panier, clics WhatsApp.</div>'
 +'<p><span class="dot"></span><b>'+on.length+'</b> en ligne maintenant · '+L.length+' derniers visiteurs</p><div class="tw"><table><tr><th>Visiteur</th><th>Dernière visite</th><th>Source</th><th>Appareil</th><th class="r">Visites</th><th class="r">Pages</th><th>Dernier produit vu</th><th>Intérêt</th><th></th></tr>'
 +L.map(function(v){return '<tr><td>'+(v.online?'<span class="dot" title="En ligne"></span>':'')+(v.lead?'<b>'+esc(v.lead.name||v.lead.phone)+'</b><br><small class="mu">'+esc(v.lead.phone)+'</small>':esc(v.label))+'</td><td>'+ago(v.lastSeen)+'</td><td>'+esc(SRC[v.source]||v.source)+'</td><td>'+esc(v.device)+'</td><td class="r">'+v.sessions+'</td><td class="r">'+v.pageviews+'</td><td>'+esc(v.lastProduct)+'</td><td><span class="seg '+v.segment+'">'+v.segment+'</span> <span class="sc">'+v.score+'</span></td><td><button class="btn s o" onclick="journey(\''+v.vid+'\',\''+esc(v.lead?v.lead.name||v.lead.phone:v.label).replace(/'/g,'')+'\')">Parcours</button></td></tr>'}).join('')+'</table></div>'}
var EV={view:'Page vue',product:'Produit consulté',cart_add:'Ajout au panier',wa_click:'Clic WhatsApp',search:'Recherche',order:'Commande',survey:'Sondage rempli',lead:'Inscription',review:'Avis laissé'};
async function journey(vid,name){$('#dw').innerHTML='<div class="drawer" onclick="if(event.target===this)this.parentNode.innerHTML=\'\'"><div><button class="btn s o" style="float:right" onclick="$(\'#dw\').innerHTML=\'\'">Fermer</button><h3>Parcours de '+esc(name)+'</h3><p>Chargement…</p></div></div>';
 try{var E=await api('/api/admin/visitors/'+encodeURIComponent(vid));$('#dw .drawer>div').innerHTML='<button class="btn s o" style="float:right" onclick="$(\'#dw\').innerHTML=\'\'">Fermer</button><h3>Parcours de '+esc(name)+'</h3><p class="mu">100 dernières actions, de la plus récente à la plus ancienne.</p><table>'+E.map(function(e){return '<tr><td style="white-space:nowrap">'+dt(e.ts)+'</td><td><b>'+(EV[e.type]||e.type)+'</b><br><small class="mu">'+esc(e.productName||e.meta||e.path||'')+'</small></td></tr>'}).join('')+'</table>'}catch(e){toast(e.message)}}
/* ---------- Prospects ---------- */
function leads(){var L=A.d.leads;if(!L)return '<p>Chargement…</p>';var cnt={};L.forEach(function(l){cnt[l.segment]=(cnt[l.segment]||0)+1});
 var f=L.filter(function(l){return(!A.seg||l.segment===A.seg)&&(!A.lst||l.status===A.lst)&&(!A.f||(l.name+' '+l.phone+' '+l.city+' '+l.interests).toLowerCase().indexOf(A.f.toLowerCase())>-1)});
 return '<div class="kpis">'+['Chaud','Tiède','Froid','Client'].map(function(s){return '<button class="kpi" style="text-align:left;cursor:pointer;'+(A.seg===s?'outline:2px solid var(--k)':'')+'" onclick="A.seg=A.seg===\''+s+'\'?\'\':\''+s+'\';draw()"><small><span class="seg '+s+'">'+s+'</span></small><b>'+(cnt[s]||0)+'</b><i>'+{Chaud:'score ≥ 60 : à relancer en priorité',Tiède:'score 30–59 : à nourrir',Froid:'score < 30',Client:'a déjà commandé'}[s]+'</i></button>'}).join('')+'</div>'
 +'<div class="bar"><input id="lf" placeholder="Rechercher nom, numéro, quartier…" value="'+esc(A.f)+'" oninput="A.f=this.value;rd(\'lf\')"><select onchange="A.lst=this.value;draw()"><option value="">Tous les statuts</option>'+LST.map(function(s){return '<option value="'+s[0]+'"'+(A.lst===s[0]?' selected':'')+'>'+s[1]+'</option>'}).join('')+'</select><a class="btn o" href="/api/admin/leads.csv">⬇ Exporter (Excel / CSV)</a><button class="btn g" onclick="addLead()">+ Ajouter un prospect</button></div>'
 +(f.length?'<div class="tw"><table><tr><th>Prospect</th><th>Segment</th><th class="r">Score</th><th>Intérêts</th><th class="r">Commandes</th><th>Source</th><th>Dernière activité</th><th>Statut</th><th></th></tr>'+f.map(function(l){return '<tr><td><b>'+esc(l.name||'—')+'</b><br><small class="mu">'+esc(l.phone)+(l.city?' · '+esc(l.city):'')+'</small>'+(l.consent?'':'<br><small class="dn">n\'a pas accepté les messages marketing</small>')+'</td><td><span class="seg '+l.segment+'">'+l.segment+'</span></td><td class="r"><span class="sc">'+l.score+'</span></td><td>'+esc(l.interests)+'</td><td class="r">'+l.orders+(l.spent?'<br><small class="mu">'+F(l.spent)+'</small>':'')+'</td><td>'+esc(l.source)+'</td><td>'+ago(l.lastActive)+'</td><td><select onchange="patchLead(\''+l.id+'\',{status:this.value})">'+LST.map(function(s){return '<option value="'+s[0]+'"'+(l.status===s[0]?' selected':'')+'>'+s[1]+'</option>'}).join('')+'</select></td><td style="white-space:nowrap"><a class="btn s w" target="_blank" rel="noopener" href="'+waLink(l.phone,'Bonjour '+(l.name||'')+', ici XIA SHOP. ')+'">WhatsApp</a> <button class="btn s o" onclick="noteLead(\''+l.id+'\')">Note</button> <button class="btn s o" onclick="delLead(\''+l.id+'\')">✕</button>'+(l.notes?'<br><small class="mu">📝 '+esc(l.notes)+'</small>':'')+'</td></tr>'}).join('')+'</table></div>':'<p class="mu">Aucun prospect pour ce filtre. Les prospects arrivent par les commandes, le sondage et le formulaire « Soyez prévenu(e) ».</p>')
 +'<div class="nt" style="margin-top:14px"><b>Comment lire le score (0 à 100)</b> : +1 par page vue (max 20), +2 par produit consulté (max 30), +8 par ajout au panier, +10 par clic WhatsApp, +10 sondage, +10 inscription, +30 par commande, +10 si actif ces 3 derniers jours. N\'envoyez des promotions qu\'aux personnes qui l\'ont accepté.</div>'}
async function patchLead(id,b){try{await api('/api/admin/leads/'+id,'PATCH',b);toast('Enregistré ✓');load()}catch(e){toast(e.message)}}
function noteLead(id){var l=A.d.leads.find(function(x){return x.id===id});var n=prompt('Note sur ce prospect',l.notes||'');if(n!=null)patchLead(id,{notes:n})}
async function delLead(id){if(!confirm('Supprimer ce prospect et ses données personnelles ?'))return;try{await api('/api/admin/leads/'+id,'DELETE');toast('Supprimé');load()}catch(e){toast(e.message)}}
async function addLead(){var n=prompt('Nom du prospect');if(n==null)return;var p=prompt('Numéro WhatsApp');if(!p)return;var c=prompt('Quartier (facultatif)')||'';var k=confirm('Cette personne a-t-elle accepté de recevoir vos offres sur WhatsApp ?');try{await api('/api/admin/leads','POST',{name:n,phone:p,city:c,consent:k});toast('Prospect ajouté ✓');load()}catch(e){toast(e.message)}}
/* ---------- Commandes ---------- */

function survey(){var d=A.d.survey;if(!d)return '<p>Chargement…</p>';var sv=A.svEdit||(A.svEdit=JSON.parse(JSON.stringify(d.survey)));
 return '<h2 style="margin-top:0">Résultats · '+d.total+' réponse(s)</h2>'+(d.total?'<div class="g2">'+d.results.map(function(r){return '<div class="card"><h3>'+esc(r.label)+'</h3>'+(r.type==='text'?(r.texts.length?r.texts.slice(0,15).map(function(t){return '<p style="margin:4px 0;border-bottom:1px solid var(--ln)">« '+esc(t.text)+' »</p>'}).join(''):'<p class="mu">Aucune réponse.</p>'):hbars(Object.keys(r.counts).map(function(k){return{label:k,n:r.counts[k]}}).sort(function(a,b){return b.n-a.n})))+'</div>'}).join('')+'</div>':'<p class="mu">Pas encore de réponse. Le sondage s\'affiche aux visiteurs après 45 secondes ou 3 pages vues, et dans le menu « Sondage ».</p>')

 +sv.questions.map(function(q,i){return '<div class="q"><div class="fm"><label class="f2">Question '+(i+1)+'<input data-k="label" data-i="'+i+'" value="'+esc(q.label)+'"></label><label>Type<select data-k="type" data-i="'+i+'"><option value="choice"'+(q.type==='choice'?' selected':'')+'>Un seul choix</option><option value="multi"'+(q.type==='multi'?' selected':'')+'>Plusieurs choix</option><option value="text"'+(q.type==='text'?' selected':'')+'>Réponse libre</option></select></label>'+(q.type==='text'?'':'<label class="f2">Choix (un par ligne)<textarea rows="3" data-k="options" data-i="'+i+'">'+esc((q.options||[]).join('\n'))+'</textarea></label>')+'</div><button class="btn s o" onclick="svSync();A.svEdit.questions.splice('+i+',1);draw()">Supprimer la question</button></div>'}).join('')
 +'<p><button class="btn o" onclick="svSync();A.svEdit.questions.push({id:\'q\'+Date.now().toString(36),label:\'\',type:\'choice\',options:[]});draw()">+ Ajouter une question</button> <button class="btn g" onclick="saveSv()">Enregistrer le sondage</button></p><p class="mu" style="font-size:13px">Modifier les choix d\'une question existante peut fausser la comparaison avec les anciennes réponses. Pour un nouveau sujet, ajoutez plutôt une nouvelle question.</p></div>'
 +(d.recent.length?'<h2>Dernières réponses</h2><div class="tw"><table><tr><th>Date</th><th>Contact</th>'+d.survey.questions.map(function(q){return '<th>'+esc(q.label)+'</th>'}).join('')+'</tr>'+d.recent.map(function(r){return '<tr><td>'+dt(r.ts)+'</td><td>'+(r.lead?esc(r.lead.name||'')+'<br><small class="mu">'+esc(r.lead.phone)+'</small>':'<span class="mu">anonyme</span>')+'</td>'+d.survey.questions.map(function(q){var a=r.answers[q.id];return '<td>'+esc(Array.isArray(a)?a.join(', '):a||'')+'</td>'}).join('')+'</tr>'}).join('')+'</table></div>':'')}

 if(A.edit){var p=A.edit==='new'?{status:'draft',images:[]}:P.find(function(x){return x.id===A.edit})||{};var v=function(k){return esc(p[k]==null?'':p[k])};
  return '<h2 style="margin-top:0">'+(A.edit==='new'?'Nouveau produit':'Modifier le produit')+'</h2><div class="card"><div class="fm"><label class="f2">Nom *<input id="fn" value="'+v('name')+'"></label><label class="f2">Description<textarea id="fd" rows="4">'+v('desc')+'</textarea></label><label>Prix de vente (FCFA) *<input id="fp" type="number" min="0" value="'+v('price')+'"></label><label>Prix promotionnel (facultatif)<input id="fo" type="number" min="0" value="'+v('promo')+'"></label><label>Catégorie *<select id="fc">'+catOpts(p.cat)+'</select></label><label>Marque<input id="fb" value="'+v('brand')+'"></label><label>Stock (vide = non suivi)<input id="fs" type="number" min="0" value="'+v('stock')+'"></label><label>Variantes (séparées par des virgules)<input id="fv" value="'+v('variants')+'"></label><label>Statut<select id="ft">'+[['draft','Brouillon'],['published','Publié'],['unavailable','Indisponible']].map(function(s){return '<option value="'+s[0]+'"'+(p.status===s[0]?' selected':'')+'>'+s[1]+'</option>'}).join('')+'</select></label><label style="flex-direction:row;gap:8px;align-items:center"><input id="ff" type="checkbox" '+(p.featured?'checked':'')+'> Mettre en avant sur l\'accueil</label>'
  +'<label class="f2">Ajouter des photos<input id="fi" type="file" accept="image/*" multiple onchange="upImgs(this)"></label><div class="f2" style="display:flex;gap:8px;flex-wrap:wrap">'+A.imgs.map(function(s,i){return '<span><img alt="" style="width:72px;height:72px;object-fit:cover;border-radius:8px" src="'+esc(s)+'"><br><button class="btn s o" onclick="A.imgs.splice('+i+',1);draw()">Retirer</button></span>'}).join('')+'</div></div><p><button class="btn g" id="sp" onclick="saveP()">Enregistrer</button> <button class="btn o" onclick="A.edit=null;draw()">Annuler</button></p></div>'}
 var l=P.filter(function(p){return!A.f||(p.name+p.brand).toLowerCase().indexOf(A.f.toLowerCase())>-1}).sort(function(a,b){return(b.created||0)-(a.created||0)});
 return '<div class="bar"><button class="btn g" onclick="A.edit=\'new\';A.imgs=[];draw()">+ Ajouter un produit</button><input id="af" placeholder="Rechercher…" value="'+esc(A.f)+'" oninput="A.f=this.value;rd(\'af\')"></div><p>'+P.length+' produit(s) · '+P.filter(function(p){return p.status==='published'}).length+' publié(s)</p><div class="tw"><table><tr><th></th><th>Produit</th><th>Prix</th><th>Stock</th><th class="r">Vues 30 j</th><th>Statut</th><th></th></tr>'+l.map(function(p){return '<tr><td>'+(p.images[0]?'<img alt="" src="'+esc(p.images[0])+'">':'')+'</td><td>'+esc(p.name)+'<br><small class="mu">'+esc(cn(p.cat))+'</small></td><td>'+(p.price>0?F(p.price)+(p.promo?'<br><small>promo '+F(p.promo)+'</small>':''):'<span class="dn">à définir</span>')+'</td><td>'+(p.stock==null?'—':p.stock)+'</td><td class="r">'+(p.pop||0)+'</td><td>'+({draft:'Brouillon',published:'Publié',unavailable:'Indisponible'}[p.status])+'</td><td style="white-space:nowrap"><button class="btn s" onclick="A.edit=\''+p.id+'\';A.imgs=A.d.cat.products.find(function(x){return x.id===\''+p.id+'\'}).images.slice();draw()">Modifier</button> <button class="btn s o" onclick="togP(\''+p.id+'\',\''+(p.status==='published'?'draft':'published')+'\')">'+(p.status==='published'?'Dépublier':'Publier')+'</button> <button class="btn s o" onclick="delP(\''+p.id+'\')">✕</button></td></tr>'}).join('')+'</table></div>'}
function shrink(f){return new Promise(function(res,rej){var u=URL.createObjectURL(f),i=new Image();i.onload=function(){var m=1200,r=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*r);c.height=Math.round(i.height*r);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.84))};i.onerror=function(){rej(new Error('Image illisible'))};i.src=u})}

var FK=['fn','fd','fp','fo','fc','fb','fs','fv','ft','ff'],FV={};function keepForm(){FK.forEach(function(k){var e=$('#'+k);if(e)FV[k]=e.type==='checkbox'?e.checked:e.value})}function restoreForm(){FK.forEach(function(k){var e=$('#'+k);if(e&&k in FV){if(e.type==='checkbox')e.checked=FV[k];else e.value=FV[k]}});FV={}}

 +'<label>Facebook (lien https)<input id="sf" value="'+esc(so.facebook)+'"></label><label>Instagram (lien https)<input id="sg" value="'+esc(so.instagram)+'"></label><label>TikTok (lien https)<input id="sk" value="'+esc(so.tiktok)+'"></label><label>Logo<input id="slg" type="file" accept="image/*"></label>'

async function load(){try{var t=A.tab;
 if(t==='dash')A.d.stats=await api('/api/admin/stats?days='+A.days);
 else if(t==='vis')A.d.vis=await api('/api/admin/visitors');
 else if(t==='leads')A.d.leads=await api('/api/admin/leads');
 else if(t==='orders')A.d.orders=await api('/api/admin/orders');
 else if(t==='survey')A.d.survey=await api('/api/admin/survey');
 else if(t==='reviews')A.d.reviews=await api('/api/admin/reviews');
 else A.d.cat=await api('/api/admin/catalog');
 draw()}catch(e){toast(e.message)}}
function rd(id){var a=document.activeElement,pos=a&&a.selectionStart;draw();var e=document.getElementById(id);if(e){e.focus();try{e.setSelectionRange(pos,pos)}catch(x){}}}
function draw(){var r=$('#root');
 if(A.auth===false){r.innerHTML='<form class="login" onsubmit="login(event)"><h1>XIA SHOP</h1><p>Espace vendeur</p><input id="pw" type="password" placeholder="Mot de passe" autocomplete="current-password" autofocus><button class="btn g" style="width:100%">Se connecter</button><p style="font-size:12px;margin:12px 0 0"><a href="/">← Retour à la boutique</a></p></form>';return}
 if(A.auth===null){r.innerHTML='<p style="padding:20px">Chargement…</p>';return}

 r.innerHTML='<header><b>XIA SHOP</b><span class="mu" style="color:var(--s)">Espace vendeur</span><span class="sp"></span><a href="/" target="_blank" rel="noopener">Voir la boutique ↗</a><button onclick="load()">↻ Actualiser</button><button onclick="logout()">Déconnexion</button></header><div class="tabs">'+TABS.map(function(t){return '<button class="'+(A.tab===t[0]?'on':'')+'" onclick="A.tab=\''+t[0]+'\';A.edit=null;A.f=\'\';draw();load()">'+t[1]+'</button>'}).join('')+'</div><main>'+V()+'</main>'}

(async function(){draw();try{await api('/api/admin/me');A.auth=true;draw();load()}catch(e){A.auth=false;draw()}})();
